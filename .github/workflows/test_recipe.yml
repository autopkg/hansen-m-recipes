name: Test AutoPkg Recipes

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "**/*.recipe"
      - "**/*.recipe.yaml"
      - "**/*.recipe.yml"
      - "**/*.recipe.plist"

  workflow_dispatch:
    inputs:
      recipes:
        description: "Recipe name/path(s), comma separated"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-recipes:
    name: Test AutoPkg Recipes
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Checkout AutoPkg
        uses: actions/checkout@v4
        with:
          repository: autopkg/autopkg
          path: autopkg
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install AutoPkg requirements
        shell: bash
        run: |
          set -euo pipefail
      
          python -m pip install --upgrade pip
          python -m pip install \
            --requirement .github/requirements.txt
      
      - name: Verify AutoPkg
        shell: bash
        run: |
          python autopkg/Code/autopkg version
