name: Test AutoPkg Recipes

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "**/*.recipe"
      - "**/*.recipe.yaml"
      - "**/*.recipe.yml"
      - "**/*.recipe.plist"

  workflow_dispatch:
    inputs:
      recipes:
        description: "Recipe name/path(s), comma separated"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-recipes:
    name: Test AutoPkg Recipes
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Checkout AutoPkg
        uses: actions/checkout@v4
        with:
          repository: autopkg/autopkg
          path: autopkg
      
      - name: Install MacAdmins Python
        shell: bash
        run: |
          set -euo pipefail
      
          # Get the latest Python 3.11 package
          PKG_URL=$(
            curl -sL \
              https://api.github.com/repos/macadmins/python/releases/latest \
            | python3 -c '
          import json
          import sys
      
          data = json.load(sys.stdin)
      
          for asset in data["assets"]:
              name = asset["name"]
              if "3.11" in name and name.endswith(".pkg"):
                  print(asset["browser_download_url"])
                  break
          '
          )
      
          if [[ -z "$PKG_URL" ]]; then
            echo "::error::Could not find MacAdmins Python 3.11 package"
            exit 1
          fi
      
          echo "Downloading MacAdmins Python:"
          echo "$PKG_URL"
      
          curl -fL "$PKG_URL" -o "$RUNNER_TEMP/macadmins-python.pkg"
      
          sudo installer \
            -pkg "$RUNNER_TEMP/macadmins-python.pkg" \
            -target /
      
      - name: Install AutoPkg requirements
        shell: bash
        run: |
          set -euo pipefail
      
          python -m pip install --upgrade pip
          python -m pip install \
            --requirement autopkg/requirements.txt
          python -m pip install \
            --requirement .github/requirements.txt
      
      - name: Verify MacAdmins Python
        shell: bash
        run: |
          set -euo pipefail
      
          PYTHON="/Library/ManagedFrameworks/Python/Python3.framework/Versions/Current/bin/python3"
      
          echo "Python:"
          "$PYTHON" --version
      
          echo
          echo "PyObjC:"
          "$PYTHON" -c "import objc; print(objc.__version__)"
      
          echo
          echo "Foundation:"
          "$PYTHON" -c "import Foundation; print('Foundation OK')"
      
          echo
          echo "CoreFoundation:"
          "$PYTHON" -c "import CoreFoundation; print('CoreFoundation OK')"
      
          echo
          echo "AutoPkg:"
          "$PYTHON" autopkg/Code/autopkg version
