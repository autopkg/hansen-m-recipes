name: Test AutoPkg Recipes

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "**/*.recipe"
      - "**/*.recipe.yaml"
      - "**/*.recipe.yml"
      - "**/*.recipe.plist"

  workflow_dispatch:
    inputs:
      recipes:
        description: "Recipe name/path(s), comma separated (used when no recipes changed)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-recipes:
    name: Test AutoPkg Recipes
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install AutoPkg release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Finding latest AutoPkg release package..."

          PKG_URL=$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/autopkg/autopkg/releases/latest" \
            | python3 -c '
          import json
          import sys

          release = json.load(sys.stdin)

          for asset in release["assets"]:
              if asset["name"].endswith(".pkg"):
                  print(asset["browser_download_url"])
                  break
          '
          )
          echo "$PKG_URL"
          if [[ -z "$PKG_URL" ]]; then
            echo "::error::Could not find AutoPkg .pkg in latest release."
            exit 1
          fi

          echo "Downloading AutoPkg package..."

          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "$PKG_URL" \
            -o "$RUNNER_TEMP/autopkg.pkg"

          echo "Installing AutoPkg..."

          sudo installer \
            -pkg "$RUNNER_TEMP/autopkg.pkg" \
            -target /
          echo
          echo "AutoPkg installation complete."

      - name: Install latest MacAdmins Python
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$RUNNER_TEMP/macadmins-python-release.json"

          echo "Getting latest MacAdmins Python release..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/macadmins/python/releases/latest" \
            -o "$RELEASE_JSON"

          PKG_URL=$(
            python3 - "$RELEASE_JSON" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as f:
              data = json.load(f)

          assets = data.get("assets", [])

          packages = [
              asset
              for asset in assets
              if asset.get("name", "").endswith(".pkg")
          ]

          if not packages:
              print(
                  "No .pkg assets found in latest MacAdmins Python release.",
                  file=sys.stderr,
              )

              print("Available assets:", file=sys.stderr)

              for asset in assets:
                  print(
                      f"  {asset.get('name')}",
                      file=sys.stderr,
                  )

              sys.exit(1)

          print(packages[0]["browser_download_url"])
          PY
          )

          echo "Downloading latest MacAdmins Python:"
          echo "$PKG_URL"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$PKG_URL" \
            -o "$RUNNER_TEMP/macadmins-python.pkg"

          echo "Installing MacAdmins Python..."

          sudo installer \
            -pkg "$RUNNER_TEMP/macadmins-python.pkg" \
            -target /

      - name: Install AutoPkg requirements
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install \
            --requirement .github/requirements.txt

      - name: Verify MacAdmins Python
        shell: bash
        run: |
          set -euo pipefail

          PYTHON="/Library/ManagedFrameworks/Python/Python3.framework/Versions/Current/bin/python3"

          echo "Python:"
          "$PYTHON" --version

          echo
          echo "PyObjC:"
          "$PYTHON" -c "import objc; print(objc.__version__)"

          echo
          echo "Foundation:"
          "$PYTHON" -c "import Foundation; print('Foundation OK')"

          echo
          echo "CoreFoundation:"
          "$PYTHON" -c "import CoreFoundation; print('CoreFoundation OK')"
      - name: Verify AutoPkg
        shell: bash
        run: |
          set -euo pipefail
      
          echo "AutoPkg binary:"
          command -v autopkg
      
          echo
          echo "AutoPkg version:"
          autopkg version

      #
      # Configure this repository as a recipe search directory
      #
      - name: Configure AutoPkg
        shell: bash
        run: |
          defaults write com.github.autopkg RECIPE_SEARCH_DIRS -array \
            "$GITHUB_WORKSPACE" \
            "$HOME/Library/AutoPkg/RecipeRepos"

          echo "Recipe search directories:"
          defaults read com.github.autopkg RECIPE_SEARCH_DIRS

      #
      # Determine which recipes to test
      #
      - name: Select recipes
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RECIPE_INPUT: ${{ inputs.recipes }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            BASE_SHA=$(git merge-base "refs/remotes/origin/$DEFAULT_BRANCH" HEAD)
            HEAD_SHA=HEAD
          fi

          git diff \
            --name-only \
            --diff-filter=ACMRT \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            | awk '/\.recipe(\.yaml|\.yml|\.plist)?$/' \
            | sort -u \
            > "$RUNNER_TEMP/recipes.txt"

          if [[ ! -s "$RUNNER_TEMP/recipes.txt" && "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$RECIPE_INPUT" == *$'\n'* || "$RECIPE_INPUT" == *$'\r'* ]]; then
              echo "::error::Recipe input must be a comma-separated list on one line."
              exit 1
            fi

            IFS=',' read -r -a requested_recipes <<< "$RECIPE_INPUT"
            for recipe in "${requested_recipes[@]}"; do
              recipe="${recipe#"${recipe%%[![:space:]]*}"}"
              recipe="${recipe%"${recipe##*[![:space:]]}"}"
              if [[ -n "$recipe" ]]; then
                printf '%s\n' "$recipe" >> "$RUNNER_TEMP/recipes.txt"
              fi
            done

            if [[ ! -s "$RUNNER_TEMP/recipes.txt" ]]; then
              echo "::error::No recipes were supplied."
              exit 1
            fi
            echo "Using recipes from workflow input."
          fi

          if [[ -s "$RUNNER_TEMP/recipes.txt" ]]; then
            echo "Recipes to test:"
            cat "$RUNNER_TEMP/recipes.txt"
            echo "has_recipes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No recipes changed."
            echo "has_recipes=false" >> "$GITHUB_OUTPUT"
          fi

      #
      # Test each selected recipe
      #
      - name: Test selected recipes
        if: steps.changed.outputs.has_recipes == 'true'
        shell: bash
        run: |
          set -uo pipefail

          failed=0

          while IFS= read -r recipe; do

            echo
            echo "=================================================="
            echo "Testing: $recipe"
            echo "=================================================="
            echo

            if [[ -f "$GITHUB_WORKSPACE/$recipe" ]]; then
              recipe_arg="$GITHUB_WORKSPACE/$recipe"
            else
              recipe_arg="$recipe"
            fi

            if autopkg run -vv "$recipe_arg"; then
              echo
              echo "PASS: $recipe"
            else
              echo
              echo "::error file=$recipe::AutoPkg recipe failed"
              failed=1
            fi

          done < "$RUNNER_TEMP/recipes.txt"

          exit "$failed"