name: Test AutoPkg Recipes

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "**/*.recipe"
      - "**/*.recipe.yaml"
      - "**/*.recipe.yml"
      - "**/*.recipe.plist"

  workflow_dispatch:
    inputs:
      recipes:
        description: "Recipe name/path(s), comma separated"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-recipes:
    name: Test AutoPkg Recipes
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install AutoPkg release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Finding latest AutoPkg release package..."

          PKG_URL=$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/autopkg/autopkg/releases/latest" \
            | python3 -c '
          import json
          import sys

          release = json.load(sys.stdin)

          for asset in release["assets"]:
              if asset["name"].endswith(".pkg"):
                  print(asset["browser_download_url"])
                  break
          '
          )

          if [[ -z "$PKG_URL" ]]; then
            echo "::error::Could not find AutoPkg .pkg in latest release."
            exit 1
          fi

          echo "Downloading AutoPkg package..."

          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "$PKG_URL" \
            -o "$RUNNER_TEMP/autopkg.pkg"

          echo "Installing AutoPkg..."

          sudo installer \
            -pkg "$RUNNER_TEMP/autopkg.pkg" \
            -target /

      - name: Install latest MacAdmins Python
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$RUNNER_TEMP/macadmins-python-release.json"

          echo "Getting latest MacAdmins Python release..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/macadmins/python/releases/latest" \
            -o "$RELEASE_JSON"

          PKG_URL=$(
            python3 - "$RELEASE_JSON" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as f:
              data = json.load(f)

          assets = data.get("assets", [])

          packages = [
              asset
              for asset in assets
              if asset.get("name", "").endswith(".pkg")
          ]

          if not packages:
              print(
                  "No .pkg assets found in latest MacAdmins Python release.",
                  file=sys.stderr,
              )

              print("Available assets:", file=sys.stderr)

              for asset in assets:
                  print(
                      f"  {asset.get('name')}",
                      file=sys.stderr,
                  )

              sys.exit(1)

          print(packages[0]["browser_download_url"])
          PY
          )

          echo "Downloading latest MacAdmins Python:"
          echo "$PKG_URL"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$PKG_URL" \
            -o "$RUNNER_TEMP/macadmins-python.pkg"

          echo "Installing MacAdmins Python..."

          sudo installer \
            -pkg "$RUNNER_TEMP/macadmins-python.pkg" \
            -target /

          echo
          echo "Verifying installation..."

          PYTHON="/Library/ManagedFrameworks/Python/Python3.framework/Versions/Current/bin/python3"

          "$PYTHON" --version

          "$PYTHON" -c \
            "import Foundation; print('Foundation OK')"

          "$PYTHON" -c \
            "import CoreFoundation; print('CoreFoundation OK')"
      - name: Install AutoPkg requirements
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install \
            --requirement autopkg/requirements.txt
          python -m pip install \
            --requirement .github/requirements.txt

      - name: Verify MacAdmins Python
        shell: bash
        run: |
          set -euo pipefail

          PYTHON="/Library/ManagedFrameworks/Python/Python3.framework/Versions/Current/bin/python3"

          echo "Python:"
          "$PYTHON" --version

          echo
          echo "PyObjC:"
          "$PYTHON" -c "import objc; print(objc.__version__)"

          echo
          echo "Foundation:"
          "$PYTHON" -c "import Foundation; print('Foundation OK')"

          echo
          echo "CoreFoundation:"
          "$PYTHON" -c "import CoreFoundation; print('CoreFoundation OK')"

          echo
          echo "AutoPkg:"
          "$PYTHON" autopkg/Code/autopkg version
